location /public {
    root /data;
}

location /api {
    include api_proxy.conf;
}

location /admin {
    return 404;
}

include /data/config/portal_locations.conf;

location /.well-known {
    alias /data/ssl/.well-known;
}

location / {
    root /app/dist;
    try_files $uri $uri/ /index.html =404;
}
